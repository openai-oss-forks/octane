name: Bench

# Temporary fork-only measurement for PR #982. The dispatched branch contains
# exactly PR 7c9aacfd5 plus this workflow change. The production mount gate and
# compiled Activity comparisons run with one pinned installation on one runner.

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 1e6ca0ed65a48efd94be1927fd371e853aa538c1
      PR_SHA: 7c9aacfd53c3dd699de262f1e5a54d317ba428b1
      RESULTS: benchmarks/results/pr982-root-transactions

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --prod false --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter octane-js-framework-benchmarks exec playwright install --with-deps chromium

      - name: Record exact source and runner provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          test "$(git diff --name-only "$PR_SHA" HEAD)" = '.github/workflows/bench.yml'
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$PR_SHA^{commit}"
          {
            printf 'workflow_head=%s\n' "$(git rev-parse HEAD)"
            printf 'candidate_pr_head=%s\n' "$PR_SHA"
            printf 'baseline_main=%s\n' "$BASE_SHA"
            printf 'node=%s\n' "$(node --version)"
            printf 'pnpm=%s\n' "$(pnpm --version)"
            printf 'lockfile_sha256=%s\n' "$(sha256sum pnpm-lock.yaml)"
            printf 'candidate_runtime_sha256=%s\n' "$(sha256sum packages/octane/src/runtime.ts)"
            printf 'js_framework_fixture_sha256=%s\n' "$(sha256sum benchmarks/js-framework/octane-tsrx/src/Main.tsrx)"
            printf 'activity_fixture_sha256=%s\n' "$(sha256sum benchmarks/activity/App.tsrx)"
          } | tee "$RESULTS/provenance.txt"

      - name: Count candidate 1k production mount calls
        id: js_framework
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter octane-tsrx-jsbench build 2>&1 | tee "$RESULTS/js-framework-build.log"
          sha256sum benchmarks/js-framework/octane-tsrx/dist/assets/*.js | tee "$RESULTS/js-framework-assets.sha256"
          pnpm --filter octane-tsrx-jsbench exec vite preview --host 127.0.0.1 --port 5176 --strictPort > "$RESULTS/js-framework-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5176/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5176/ > /dev/null
          set +e
          TARGETS='[{"name":"octane-tsrx","url":"http://127.0.0.1:5176/","ready":"#run"}]' BENCH_JSON="$RESULTS/js-framework-candidate.json" node benchmarks/js-framework/run.mjs 8 2>&1 | tee "$RESULTS/js-framework-candidate.log"
          gate_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$gate_status" > "$RESULTS/js-framework-status.txt"
          exit "$gate_status"
        continue-on-error: true

      - name: Measure compiled Activity base and candidate ABAB
        id: activity
        shell: bash
        run: |
          set -euo pipefail
          for variant in base-1 candidate-1 base-2 candidate-2; do
            case "$variant" in
              base-*) revision="$BASE_SHA" ;;
              candidate-*) revision="$PR_SHA" ;;
            esac
            BENCH_JSON="$RESULTS/activity-$variant.json" node benchmarks/activity/run.mjs 8 --target=octane-tsrx "--octane-revision=$revision" 2>&1 | tee "$RESULTS/activity-$variant.log"
          done
          for variant in base candidate; do
            if test "$variant" = base; then revision="$BASE_SHA"; else revision="$PR_SHA"; fi
            BENCH_JSON="$RESULTS/activity-work-$variant.json" node benchmarks/activity/work.mjs --target=octane-tsrx "--octane-revision=$revision" 2>&1 | tee "$RESULTS/activity-work-$variant.log"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr982-root-transactions-${{ github.run_id }}
          path: benchmarks/results/pr982-root-transactions/
          if-no-files-found: warn

      - name: Enforce mount gate and Activity comparisons
        if: always()
        shell: bash
        run: |
          test "${{ steps.js_framework.outcome }}" = success
          test "${{ steps.activity.outcome }}" = success
